name: zebilo
description: زبیلو — دستیار خرید روزانه خانواده‌ها
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Network ───────────────────────────────────────────────────────────────
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # ── Storage ───────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # ── UI ────────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.1.0
  pinput: ^5.0.0

  # ── Utils ─────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  persian_datetime_picker: ^3.2.0
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.1

  # ── Icons ─────────────────────────────────────────────────────────────────
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-Regular.ttf
          weight: 400
        - asset: assets/fonts/Estedad-Medium.ttf
          weight: 500
        - asset: assets/fonts/Estedad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700
